name: K6 Performance Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

jobs:
  run-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup K6
        uses: grafana/setup-k6-action@v1.2.2
      - name: Run local k6 test
        uses: grafana/run-k6-action@v1.4.0
        with:
          path: src/tests

      - name: Upload k6 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-report
          path: src/output/index.html
